services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: firewall_user
      POSTGRES_PASSWORD: firewall_password
      POSTGRES_DB: firewall_dev

    ports:
      - "5433:5432"

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewall_user -d firewall_dev"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - env.dev

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_dev_data: